services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DOCS_DIR: /docs
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports: ["5173:5173"]
    depends_on: [backend]
